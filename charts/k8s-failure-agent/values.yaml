# Default settings for the chart. Override any of them with -f my-values.yaml or --set key=value.

# The container image (built from the repository's Dockerfile).
image:
  repository: k8s-failure-agent
  # Empty means "use the chart's appVersion" (see Chart.yaml).
  tag: ""
  # IfNotPresent: use the image already loaded into the cluster (kind load docker-image); don't pull it.
  pullPolicy: IfNotPresent

# Rename everything this release creates (rarely needed).
nameOverride: ""
fullnameOverride: ""

# Settings shared by the components, published in a ConfigMap.
settings:
  # Namespaces the collector watches and the exporter reports on.
  namespaces:
    - predict-lab
    - remediate-lab
    - pattern-lab
  # Namespace where incidents are raised (and where approved actions may run).
  remediationNamespace: remediate-lab
  # How often the collector reads metrics, in seconds.
  collectorIntervalSeconds: 15

# PostgreSQL, run inside the release as a StatefulSet (one pod with its own persistent disk).
database:
  image: postgres:16.9-bookworm
  name: k8s_agent
  storage: 1Gi
  # Empty: the cluster's default StorageClass (kind provides one).
  storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# Database migrations (alembic upgrade head), run by Helm as a hook: after install, and before every upgrade.
migrations:
  # Give up after this many seconds, so a stuck migration fails the upgrade instead of hanging it.
  timeoutSeconds: 300
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# ---------------------------------------------------------------------------------------------------------
# Components. Each runs as its own Deployment with its own ServiceAccount, holding only the permissions it needs.

collector:
  # Disk forecasts read kubelet statistics through the API server's node proxy (nodes/proxy, get). That is a
  # powerful permission: the kubelet API can do more than report statistics. Set to false to drop it (and lose
  # the disk signals); memory and Job collection keep working.
  nodeStats: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

watcher:
  intervalSeconds: 60
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}

api:
  port: 8000
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
  # A sidecar container regenerates the dashboard the approval page shows, into a volume shared with the API.
  dashboard:
    intervalSeconds: 60
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 1Gi}

exporter:
  port: 9105
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 512Mi}

# Prometheus discovers the exporter through a ServiceMonitor, created only when the cluster has the
# Prometheus Operator's ServiceMonitor type. kube-prometheus-stack selects ServiceMonitors by its release label.
serviceMonitor:
  enabled: true
  interval: 15s
  labels:
    release: monitoring
