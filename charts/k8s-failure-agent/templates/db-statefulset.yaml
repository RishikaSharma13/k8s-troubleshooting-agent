# PostgreSQL as a StatefulSet: a stable identity and its own persistent disk, which survive pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fa.dbName" . }}
  labels:
    {{- include "fa.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "fa.dbName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fa.selectorLabels" (dict "root" . "component" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fa.labels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      # The database needs no access to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        # The image's postgres user; fsGroup makes the disk writable for it, so nothing runs as root.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "fa.dbSecretName" . }}, key: password}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            # A subdirectory: the volume's root may contain lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            # Writes go only to the data volume, the socket directory and /tmp (found by the Trivy config scan).
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -h, 127.0.0.1]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres, -h, 127.0.0.1]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # PostgreSQL writes its socket here; an emptyDir keeps it writable for the non-root user.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "fa.selectorLabels" (dict "root" . "component" "database") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage | quote }}
