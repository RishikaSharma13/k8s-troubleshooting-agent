{{- /*
One ServiceAccount per component. Only the collector and the API talk to the Kubernetes API, so only their
pods receive an API token; the watcher and the exporter work from the database alone and get none.
*/ -}}
{{- $root := . }}
{{- range $component, $token := dict "collector" true "api" true "watcher" false "exporter" false }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fa.componentName" (dict "root" $root "component" $component) }}
  labels:
    {{- include "fa.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: {{ $token }}
{{- end }}
