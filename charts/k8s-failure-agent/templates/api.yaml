# API: incidents, approvals and the approval page (/ui); its executor runs approved actions in the remediation
# namespace only. A sidecar regenerates the dashboard into a volume the two containers share.
# Reached with kubectl port-forward (ClusterIP only): it is never exposed outside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fa.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "fa.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fa.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fa.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "fa.componentName" (dict "root" . "component" "api") }}
      securityContext:
        {{- include "fa.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "fa.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [uvicorn, app.main:app, --app-dir, backend, --host, 0.0.0.0, --port, {{ .Values.api.port | quote }}]
          {{- include "fa.appEnv" . | nindent 10 }}
            - name: DASHBOARD_HTML
              value: /shared/dashboard.html
          ports:
            - {name: http, containerPort: {{ .Values.api.port }}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            {{- include "fa.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: shared, mountPath: /shared}
        - name: dashboard
          image: {{ include "fa.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -c]
          args:
            - >-
              while true; do
              python -m app.predictor.dashboard --out /shared/dashboard.html
              --report docs/results/final-memory.md --signals-report docs/results/final-storage-jobs.md
              || echo "dashboard generation failed, retrying";
              sleep {{ .Values.api.dashboard.intervalSeconds }}; done
          {{- include "fa.appEnv" . | nindent 10 }}
          securityContext:
            {{- include "fa.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.dashboard.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: shared, mountPath: /shared}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: shared, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fa.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "fa.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "fa.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.port }}, targetPort: http}
