{{- /*
The database password. Generated ONCE: on later installs and upgrades, `lookup` finds the existing Secret and
reuses its password, because PostgreSQL keeps the password it was first started with. A new random password on
every upgrade would lock the components out of their own data.
`lookup` needs a live cluster: under `helm template` (and so under Argo CD) it returns nothing, and every render
would produce a new password. Set database.existingSecret there: this Secret is then not created at all.
*/ -}}
{{- if not .Values.database.existingSecret }}
{{- $name := include "fa.dbName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fa.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    # Kept on `helm uninstall`, like the database's disk; a reinstall then reuses both (see above).
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
