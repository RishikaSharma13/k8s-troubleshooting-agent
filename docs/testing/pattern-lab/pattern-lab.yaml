          env:
            - {name: MODE, value: "step"}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
      volumes:
        - name: scripts
          configMap: {name: patternload-script}
