---
# Steady but hot: ~195 MiB + 8 MiB toggled every 30 s; never OOMs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flat-hot
  namespace: predict-lab
  labels:
    app: flat-hot
    scenario: memory-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flat-hot
  template:
    metadata:
      labels:
        app: flat-hot
        scenario: memory-prediction
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: memload
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/scripts/memload.py"]
          env:
            - name: MODE
              value: "flat"
            - name: BASE_MIB
              value: "195"
            - name: JITTER_MIB
              value: "8"
            - name: JITTER_PERIOD_S
              value: "30"
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: memload-script
