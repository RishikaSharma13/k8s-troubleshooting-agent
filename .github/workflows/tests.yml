name: tests

on:
  push:
  pull_request:

# The token only reads the repository; nothing in CI needs to write yet.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: k8s_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database tests run only against a *_test database (see backend/tests/conftest.py)
      DATABASE_URL: postgresql://postgres:password@localhost:5432/k8s_agent_test
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      # In CI the chart tests must run: a missing helm or kubeconform is a failure here, not a skip.
      REQUIRE_CHART_TOOLS: "1"
      HELM_VERSION: v4.3.0
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Install helm and kubeconform (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum --check "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" linux-amd64/helm
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS"
          grep " kubeconform-linux-amd64.tar.gz$" CHECKSUMS | sha256sum --check
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 linux-amd64/helm kubeconform /usr/local/bin/
          helm version --short && kubeconform -v
      - name: Lint the Helm chart
        run: helm lint charts/k8s-failure-agent
      - name: Migrate an empty database from the first revision
        run: alembic upgrade head
      - name: Run the test suite
        run: python -m pytest backend/tests -q -p no:cacheprovider -rs

  image:
    runs-on: ubuntu-22.04
    env:
      TRIVY_VERSION: 0.76.2
      # Google's mirror first: GitHub's registry sometimes rate-limits the vulnerability database download.
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan the configuration we ship (Dockerfile, Helm chart); fail on HIGH or CRITICAL
        # docs/testing holds the deliberately simple lab workloads, which are not deployed by the chart.
        run: trivy config --severity HIGH,CRITICAL --skip-dirs docs/testing --ignorefile .trivyignore --exit-code 1 .
      - name: Build the image, tagged by commit with a prefix (an all-digit id is never read as a number)
        run: |
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker build -t "k8s-failure-agent:sha-${GITHUB_SHA::7}" .
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          IMG="k8s-failure-agent:${TAG}"
          test "$(docker run --rm "$IMG" id -u)" = 10001 && echo "runs as uid 10001"
          docker run --rm "$IMG" kubectl version --client
          docker run --rm "$IMG" python -c "import app.main, app.collector.run, app.remediation.watch, app.metrics.exporter, app.predictor.dashboard, prophet; print('imports ok')"
          if docker run --rm "$IMG" python -c "import pytest" 2>/dev/null; then echo "pytest must not be in the image"; exit 1; fi
          echo "no test tools in the image"
          docker image ls "$IMG"
      - name: Vulnerability report (HIGH and CRITICAL; for visibility, never fails)
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 0 --no-progress "k8s-failure-agent:${TAG}"
      - name: Vulnerability gate (fail on CRITICAL with a fix available)
        run: trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 --no-progress "k8s-failure-agent:${TAG}"

  publish:
    # Only reviewed, merged code is published: pushes to main, after the tests and the image checks have passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write          # the only job allowed to write anything: pushing the image and chart to ghcr.io
    env:
      HELM_VERSION: v4.3.0
      TRIVY_VERSION: 0.76.2
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Install helm (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum --check "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
      - name: Build the image to publish (tagged by commit; never "latest")
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"          # registry paths must be lowercase
          image="ghcr.io/${owner}/k8s-failure-agent:sha-${GITHUB_SHA::7}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${image}" .
      - name: Vulnerability gate on the exact image being published
        run: trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 --no-progress "${IMAGE}"
      - name: Push to GitHub's container registry (short-lived job token; no stored password)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")"
          docker logout ghcr.io
          {
            echo "### Image published"
            echo ""
            echo "- tag: \`${IMAGE}\`"
            echo "- digest: \`${digest}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the Helm chart as an OCI artifact, paired with this image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="$(awk '$1 == "version:" {print $2}' charts/k8s-failure-agent/Chart.yaml)"
          # One chart version per commit, never republished. "sha<commit>" (not "sha.<commit>"): a semver number
          # part may not start with 0, and a commit id can.
          version="${base}-sha${GITHUB_SHA::7}"
          helm lint charts/k8s-failure-agent
          helm package charts/k8s-failure-agent --version "${version}" --app-version "sha-${GITHUB_SHA::7}" -d "$RUNNER_TEMP/chart"
          echo "${REGISTRY_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          helm push "$RUNNER_TEMP/chart/k8s-failure-agent-${version}.tgz" "oci://ghcr.io/${owner}/charts" 2>&1 | tee "$RUNNER_TEMP/push.log"
          helm show chart "oci://ghcr.io/${owner}/charts/k8s-failure-agent" --version "${version}" | grep -E '^(version|appVersion):'
          helm registry logout ghcr.io
          {
            echo ""
            echo "### Chart published"
            echo ""
            echo "- chart: \`oci://ghcr.io/${owner}/charts/k8s-failure-agent\` version \`${version}\`"
            echo "- deploys image: \`sha-${GITHUB_SHA::7}\`"
            echo "- $(grep -m1 -i digest "$RUNNER_TEMP/push.log")"
          } >> "$GITHUB_STEP_SUMMARY"
