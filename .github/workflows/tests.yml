name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: k8s_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database tests run only against a *_test database (see backend/tests/conftest.py)
      DATABASE_URL: postgresql://postgres:password@localhost:5432/k8s_agent_test
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Migrate an empty database from the first revision
        run: alembic upgrade head
      - name: Run the test suite
        run: python -m pytest backend/tests -q -p no:cacheprovider -rs
